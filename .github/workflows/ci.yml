name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Format check
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Build
        run: make build

      - name: Test (mock LLM)
        # The unit tests spin up their own httptest LLM servers, so no real
        # API key or network access is needed.
        run: make test

      - name: Test (race detector)
        run: make test-race

      - name: Coverage
        run: make coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            coverage.html
          retention-days: 7

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: false

  smoke:
    # End-to-end run of the built binary against a local mock LLM server,
    # so a real process (not just in-process tests) is exercised.
    name: smoke (mock LLM)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build
        run: make build

      - name: Run against mock LLM
        run: |
          set -euo pipefail

          # Mock LLM: an OpenAI-compatible endpoint that always returns a
          # valid Keep a Changelog entry. GET is answered too so the readiness
          # probe below waits for a real 200 instead of a 501.
          cat > /tmp/mock-llm.py <<'EOF'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          ENTRY = ("## [1.1.1] - 2026-01-15\n\n### Added\n\n- A new feature\n\n"
                   "### Fixed\n\n- A bug\n")

          class H(BaseHTTPRequestHandler):
              def reply(self, payload):
                  body = json.dumps(payload).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  self.reply({"status": "ok"})

              def do_POST(self):
                  self.reply({"choices": [{"message": {"role": "assistant", "content": ENTRY}}]})

              def log_message(self, *a):
                  pass

          HTTPServer(("127.0.0.1", 8931), H).serve_forever()
          EOF
          python3 /tmp/mock-llm.py &
          MOCK_PID=$!
          trap 'kill "$MOCK_PID" 2>/dev/null || true' EXIT
          ready=0
          for _ in $(seq 1 50); do
            if curl -fsS -o /dev/null http://127.0.0.1:8931/; then ready=1; break; fi
            sleep 0.1
          done
          test "$ready" -eq 1

          # A scratch git repo to release in.
          rm -rf /tmp/kaclaig-smoke && mkdir -p /tmp/kaclaig-smoke && cd /tmp/kaclaig-smoke
          git init -q .
          git config user.email ci@example.com
          git config user.name ci
          printf '# Changelog\n\n## [Unreleased]\n' > CHANGELOG.md
          git add . && git commit -qm "init" && git tag v1.1.0
          echo "change" > feature.txt && git add . && git commit -qm "feat: add a feature"

          # Generate the entry against the mock LLM (no file write).
          # LLM settings are provided via an inline config blob (-C).
          "$GITHUB_WORKSPACE/bin/kaclaig" --new-version 1.1.1 --from v1.1.0 -p \
            -C '{"providers":{"mock":{"settings":{"baseURL":"http://127.0.0.1:8931/v1","apiKey":"test"}}},"model":"mock/mock"}' \
            | tee /tmp/entry.md
          grep -q "## \[1.1.1\]" /tmp/entry.md
